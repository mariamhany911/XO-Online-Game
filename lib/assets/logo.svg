<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 320" width="100%" height="100%">
  <defs>
    <!-- Purple Glow -->
    <filter id="glowPurple" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#B026FF" flood-opacity="0.6"/>
    </filter>
    
    <!-- Gold Glow -->
    <filter id="glowGold" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#FFD700" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- The "O" Element (Left) -->
  <circle cx="110" cy="130" r="45" fill="none" stroke="#FFD700" stroke-width="16" stroke-linecap="round" filter="url(#glowGold)" />

  <!-- The "X" Element (Right / Intersecting) -->
  <g stroke="#B026FF" stroke-width="16" stroke-linecap="round" filter="url(#glowPurple)">
    <line x1="150" y1="85" x2="230" y2="175" />
    <line x1="230" y1="85" x2="150" y2="175" />
  </g>

  <!-- Clean Typography -->
  <text x="150" y="245" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="28" fill="#B026FF" text-anchor="middle" letter-spacing="4">
    EXO<tspan fill="#FFD700">MANIA</tspan>
  </text>
  
  <text x="150" y="270" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="11" fill="#B026FF" text-anchor="middle" letter-spacing="6">
    <tspan fill="#B026FF">T</tspan><tspan fill="#4DA6FF">I</tspan><tspan fill="#FF4F9A">C</tspan>
    <tspan fill="#FFD700">T</tspan><tspan fill="#FF8C42">A</tspan><tspan fill="#42D6C5">C</tspan>
    <tspan fill="#B026FF">T</tspan><tspan fill="#4DA6FF">O</tspan><tspan fill="#FFD700">E</tspan>
  </text>
</svg>
